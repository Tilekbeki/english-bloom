<header id="top" class="container header">
  <a class="brand" routerLink="/" aria-label="English Bloom — главная">
    <img src="favicon.svg" width="35" height="35" alt="" />
    <span lang="en">english bloom<span class="brand-dot">.</span></span>
  </a>
  <nav aria-label="Основная навигация">
    @for (menuItem of menuItems(); track menuItem.id) {
      <a
        [routerLink]="menuItem.path"
        routerLinkActive="menu_active"
        [routerLinkActiveOptions]="{
          paths: menuItem.path === '/' ? 'exact' : 'subset',
          queryParams: 'ignored',
          matrixParams: 'ignored',
          fragment: 'ignored',
        }"
        ariaCurrentWhenActive="page"
        >{{ menuItem.title }}</a
      >
    }
  </nav>
  @if (session.signedIn()) {
    <button class="session-action" type="button" (click)="signOut()">Выйти</button>
  } @else {
    <a class="session-action" routerLink="/login">Войти</a>
  }
</header>
