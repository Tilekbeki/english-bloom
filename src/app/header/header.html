<header class="container header">
  <a class="brand" href="#top" aria-label="English Bloom — главная">
    <img src="favicon.svg" width="35" height="35" alt="" />
    <span lang="en">english bloom<span class="brand-dot">.</span></span>
  </a>
  <nav aria-label="Основная навигация">
    @for (menuItem of menuItems(); track menuItem.id) {
      <button [class.menu_active]="currentPage() === menuItem.page" type="button" (click)="onPageSelect()(menuItem.id, menuItem.page)">
        {{ menuItem.title }}
      </button>
    }
  </nav>
  <span class="header-note" lang="en">A little review, every day.</span>
</header>
